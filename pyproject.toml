[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "selfrefinegan"
version = "1.0.0"
description = "File-based implementation of SelfRefineGAN for low-light image enhancement"
readme = "README.md"
requires-python = ">=3.10,<3.12"
license = {text = "MIT"}
authors = [{name = "Muhammad Atif"}]
dependencies = [
  "tensorflow==2.15.1",
  "numpy==1.26.4",
  "Pillow==10.4.0",
  "matplotlib==3.8.4",
  "scikit-image==0.22.0",
  "PyYAML==6.0.2",
  "h5py==3.10.0",
]

[tool.setuptools.packages.find]
include = ["selfrefine_gan*"]
